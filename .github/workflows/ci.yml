name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  COMPOSE_PROJECT_NAME: slumber-mill-ci

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the bind mounts and the app UID
        run: |
          echo "APP_UID=$(id -u)" > .env
          mkdir -p var/out

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the dev image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: dev
          load: true
          set: |
            dev.tags=${{ env.COMPOSE_PROJECT_NAME }}-dev
            *.cache-from=type=gha,scope=dev
            *.cache-to=type=gha,scope=dev,mode=max

      - name: Build the runtime images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: migrate,worker-encode
          set: |
            *.cache-from=type=gha,scope=dev
            *.cache-from=type=gha,scope=runtime
            *.cache-from=type=gha,scope=runtime-media
            migrate.cache-to=type=gha,scope=runtime,mode=max
            worker-encode.cache-to=type=gha,scope=runtime-media,mode=max

      - name: Check formatting
        run: |
          unformatted="$(docker compose run --rm -T --no-deps dev gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt would change:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: docker compose run --rm -T --no-deps dev go vet -tags integration,soak ./...

      - name: Unit tests
        run: docker compose run --rm -T --no-deps dev go test -race ./...

      - name: Whole suite
        run: docker compose run --rm -T dev

      - name: Check that go mod tidy changes nothing
        run: |
          docker compose run --rm -T --no-deps dev go mod tidy
          git diff --exit-code -- src/go.mod src/go.sum

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
