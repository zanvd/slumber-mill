# Used by process-checks.sh on top of compose.yaml: the checks get their own data directory, which the script
# empties, and publish no port, so they can run beside a local stack.
x-check-data: &check-data
  type: bind
  source: ./var/out/process-checks/data
  target: /data
  bind:
    create_host_path: false

services:
  api:
    ports: !reset []
    volumes:
      - *check-data

  worker-encode:
    volumes:
      - *check-data

  worker-webhook:
    volumes:
      - *check-data

  # The script's HTTP client, run with compose run --rm.
  curl:
    profiles: ["process-checks"]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    entrypoint: ["curl"]
    volumes:
      - type: bind
        source: ./var/out/process-checks
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
