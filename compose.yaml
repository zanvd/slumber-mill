x-runtime-build: &runtime-build
  context: .
  target: runtime
  args:
    APP_UID: ${APP_UID:-1000}

x-data-volume: &data-volume
  type: bind
  source: ./var/data
  target: /data
  bind:
    create_host_path: false

# DEV ONLY: a fixed key for the local stack. Production reads its key ring from a secret manager.
x-dev-only-secret-keys: &dev-only-secret-keys "1:2msFlHD07Wase5XLGZqo/KQADXNakuUYbBeutcmLD0Q="

services:
  mysql:
    image: mysql:8.4
    # The README works out the worst case, 362 connections.
    command: ["--max-connections=400"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slumber_mill
      MYSQL_USER: slumber_mill
      MYSQL_PASSWORD: slumber_mill
    configs:
      - source: mysql-test-account
        target: /docker-entrypoint-initdb.d/test-account.sql
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2m
      start_interval: 1s

  migrate:
    build: *runtime-build
    command: ["migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: *runtime-build
    command: ["api"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SLUMBER_MILL_SECRET_KEYS: *dev-only-secret-keys
      SLUMBER_MILL_WEBHOOK_ALLOW_PRIVATE: "true"
    volumes:
      - *data-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s

  worker-encode:
    build:
      context: .
      target: runtime-media
      args:
        APP_UID: ${APP_UID:-1000}
    command: ["worker", "-pool", "encode"]
    cpus: 2
    volumes:
      - *data-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s

  worker-webhook:
    build: *runtime-build
    command: ["worker", "-pool", "webhook"]
    environment:
      SLUMBER_MILL_SECRET_KEYS: *dev-only-secret-keys
      SLUMBER_MILL_WEBHOOK_ALLOW_PRIVATE: "true"
    volumes:
      - *data-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
    volumes:
      - type: bind
        source: ./src
        target: /src
        bind:
          create_host_path: false
      - type: bind
        source: ./var/out
        target: /out
        bind:
          create_host_path: false
      - go-mod:/home/app/go/pkg/mod
      - go-build:/home/app/.cache/go-build
    environment:
      SLUMBER_MILL_DSN: "slumber_mill_test:slumber_mill_test@tcp(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["go", "test", "-race", "-tags", "integration", "./..."]

  checkly:
    profiles: ["checkly"]
    build:
      context: ./checkly
      args:
        APP_UID: ${APP_UID:-1000}
    user: "${APP_UID:-1000}"
    environment:
      CHECKLY_API_KEY: ${CHECKLY_API_KEY:-}
      CHECKLY_ACCOUNT_ID: ${CHECKLY_ACCOUNT_ID:-}
    volumes:
      - type: bind
        source: ./checkly
        target: /checkly
        bind:
          create_host_path: false
      - checkly-node-modules:/checkly/node_modules

  checkly-agent:
    profiles: ["checkly-agent"]
    image: checkly/agent:8.11.0@sha256:270e21a8b9955ee13c30d1c5fb7484960bac4680702b5bfc78ebdc91acc5c012
    environment:
      API_KEY: ${CHECKLY_PL_API_KEY:-}
    restart: unless-stopped

configs:
  mysql-test-account:
    content: |
      CREATE USER 'slumber_mill_test'@'%' IDENTIFIED BY 'slumber_mill_test';
      GRANT ALTER, ALTER ROUTINE, CREATE, CREATE ROUTINE, CREATE TEMPORARY TABLES, CREATE VIEW,
        DELETE, DROP, EVENT, EXECUTE, INDEX, INSERT, LOCK TABLES, REFERENCES, SELECT, SHOW VIEW,
        TRIGGER, UPDATE
        ON `slumber\_mill\_test\_%`.* TO 'slumber_mill_test'@'%';

volumes:
  mysql-data:
  go-mod:
  go-build:
  checkly-node-modules:
